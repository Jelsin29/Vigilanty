version: 2

project_name: vigilanty

builds:
  - id: vigilanty
    main: .
    binary: vigilanty
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/jelsin/vigilanty/cmd.Version={{.Version}}

archives:
  - id: default
    builds:
      - vigilanty

checksum:
  name_template: checksums.txt
